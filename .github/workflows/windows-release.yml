name: Windows Release (x64 + x86, NSIS + ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 + x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # المعياران معاً: أجهزة ويندوز الحديثة (x86-64) والقديمة/النقاط
      # ذات ويندوز 32-bit (i686) — خطأ «لا يمكن تشغيل هذا التطبيق على
      # الكمبيوتر» كان يظهر لملف x64 فقط على أجهزة 32-bit.
      - name: Rust (stable MSVC + both targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Core parity tests (Rust)
        run: cargo test -p sela-core --locked

      - name: Frontend parity tests
        run: npx vitest run

      - name: Frontend checks + build
        run: npm run build

      # ── بناء المعيارين ──
      - name: Tauri build — x86_64 (64-bit)
        shell: pwsh
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Tauri build — i686 (32-bit)
        shell: pwsh
        run: npx tauri build --target i686-pc-windows-msvc

      - name: Version info
        id: version
        shell: pwsh
        run: |
          $TAG = if ("$env:GITHUB_REF_NAME" -like "v*") { "$env:GITHUB_REF_NAME" } else { "dev-" + "${env:GITHUB_SHA}".Substring(0,7) }
          "name=$TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Collect artifacts (both archs + ZIP + SHA256)
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null

          # مع --target يكون الناتج في target/<triple>/release/...
          $archs = @(
            @{ triple = "x86_64-pc-windows-msvc"; label = "x64" },
            @{ triple = "i686-pc-windows-msvc";   label = "x86" }
          )
          foreach ($a in $archs) {
            $rel = ".\target\$($a.triple)\release"
            # 1) المثبّت NSIS (يكشفه بأي اسم أنتجه Tauri)
            $setup = Get-ChildItem "$rel\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($setup) {
              Copy-Item $setup.FullName ".\artifacts\Sela-POS-Desktop-$tag-$($a.label)-Setup.exe"
            }
            # 2) النسخة المحمولة + تغليف ZIP (تحقق سلامة التنزيل —
            #    الملف المقطوع لا يُفك ضغطه ويندوز فيكشف الفساد فوراً)
            $portable = "$rel\sela-pos-desktop.exe"
            if (Test-Path $portable) {
              Copy-Item $portable ".\artifacts\Sela-POS-Desktop-$tag-$($a.label).exe"
              Compress-Archive -Path $portable -DestinationPath ".\artifacts\Sela-POS-Desktop-$tag-$($a.label)-Portable.zip" -Force
            }
          }

          # 3) بصمات SHA256 لكل ملف — تحقق المستخدم من اكتمال التنزيل
          $sums = Get-ChildItem .\artifacts\* | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          }
          $sums | Out-File .\artifacts\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem .\artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sela-POS-Desktop-${{ steps.version.outputs.name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.name }}"
          if (-not (gh release view $tag)) {
            gh release create $tag `
              --title "سيلا POS لسطح المكتب $tag" `
              --notes "نسخة سطح المكتب من سيلا — مطابقة لتطبيق الأندرويد v57 بكل الميزات (البيع، المخزون، التقارير، الطباعة، النسخ الاحتياطي، التراخيص).

**أي ملف أختار؟**
- **Setup.exe** — التثبيت الموصى به (64-bit: x64 / أجهزة ويندوز 32-bit: x86).
- **Portable .zip** — نسخة محمولة بلا تثبيت؛ فك الضغط وشغّل (إن لم يُفك الضغط فالتنزيل مقطوع — أعد التنزيل).
- **SHA256SUMS.txt** — بصمات التحقق من اكتمال التنزيل (certutil -hashfile <file> SHA256).

**ملاحظة الحجم**: التطبيق مبني بـ Tauri (محرك واجهة ويندوز WebView2 المدمج بالنظام) لا بـ Electron — لذا حجمه بضعة ميغابايت طبيعي تماماً: القاعدة والمنطق والواجهة كلها داخل الملف الواحد، بلا متصفح مكرر مرفق.

**المتطلبات**: ويندوز 10 أو أحدث. المثبّت يثبّت WebView2 تلقائياً عند غيابه." `
              --verify-tag
          }
          gh release upload $tag (Get-ChildItem .\artifacts\* | ForEach-Object { "$($_.FullName)#$($_.Name)" }) --clobber
