[package]
name = "sela-pos-desktop"
version = "57.1.0"
description = "سيلا POS لسطح المكتب — نظام نقاط بيع متكامل (ويندوز)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sela-core = { path = "../crates/sela-core" }
rusqlite = "0.32"
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[features]
default = []
