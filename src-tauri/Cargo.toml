[package]
name = "sela-pos-desktop"
version = "66.0.0"
description = "سيلا POS لسطح المكتب — نظام نقاط بيع متكامل (ويندوز)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sela-core = { path = "../crates/sela-core" }
rusqlite = "0.32"
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"

[features]
default = []
