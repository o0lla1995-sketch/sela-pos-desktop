[package]
name = "sela-pos-desktop"
version = "69.0.0"
description = "سيلا POS لسطح المكتب — نظام نقاط بيع متكامل (ويندوز)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sela-core = { path = "../crates/sela-core" }
rusqlite = "0.32"
# v68 (الجولة 72): tray-icon — أيقونة شريط المهام للاستمرار بالخلفية
# (إغلاق النافذة مع خادم كاشير يعمل يخفيها بدل إيقاف الخادم). الصناديق
# (tray-icon/muda) موجودة أصلاً في Cargo.lock فلا يتغير القفل إطلاقاً.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"

[features]
default = []
